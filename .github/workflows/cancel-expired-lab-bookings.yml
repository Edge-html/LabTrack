name: Cancel expired lab bookings

on:
  schedule:
    # Every 15 minutes, offset from the start of the hour to avoid peak load.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cancel-expired-lab-bookings
  cancel-in-progress: false

jobs:
  cancel-expired-bookings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install maintenance dependencies
        run: npm install --prefix maintenance --no-audit --no-fund
      - name: Cancel expired bookings
        run: node maintenance/cancelExpiredLabBookings.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
