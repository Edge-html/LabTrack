name: Migrate LabTrack data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-labtrack-data
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install maintenance dependencies
        run: npm install --prefix maintenance --no-audit --no-fund
      - name: Migrate existing LabTrack data
        run: node maintenance/migrateLegacyData.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
